# Application
spring.application.name=agent-service

server.port=8085

# PostgreSQL - Agent Database


spring.datasource.url=jdbc:postgresql://localhost:5432/agent_db

spring.datasource.username=postgres

spring.datasource.password=admin1234


# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Ollama + LangChain4j

langchain4j.ollama.chat-model.base-url=http://localhost:11434

langchain4j.ollama.chat-model.model-name=llama3.2

langchain4j.ollama.chat-model.temperature=0.7


# Feign Clients

spring.cloud.openfeign.client.config.default.connectTimeout=5000

spring.cloud.openfeign.client.config.default.readTimeout=5000

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

