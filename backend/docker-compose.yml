  version: '3.9'


  services:


    # =========================
    # DATABASE
    # =========================

    postgres:
      image: postgres:16
      container_name: postgres

      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: admin1234

      ports:
        - "5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql





    # =========================
    # OLLAMA AI
    # =========================

    ollama:
      image: ollama/ollama:latest

      container_name: ollama

      ports:
        - "11434:11434"

      volumes:
        - ollama_data:/root/.ollama

      restart: unless-stopped





    # =========================
    # EUREKA SERVER
    # =========================

    eureka-server:
      build: ./eureka-server

      container_name: eureka-server

      ports:
        - "8761:8761"

      restart: unless-stopped





    # =========================
    # API GATEWAY
    # =========================

    gateway-service:
      build: ./gateway-service

      container_name: gateway-service

      ports:
        - "8088:8088"

      depends_on:
        - eureka-server

      restart: unless-stopped






    # =========================
    # USER SERVICE
    # =========================

    user-service:
      build: ./user-service

      container_name: user-service

      ports:
        - "8082:8082"

      depends_on:
        - postgres
        - eureka-server

      restart: unless-stopped





    # =========================
    # PRODUCT SERVICE
    # =========================

    product-service:
      build: ./product-service

      container_name: product-service

      ports:
        - "8083:8083"

      depends_on:
        - postgres
        - eureka-server

      restart: unless-stopped






    # =========================
    # ORDER SERVICE
    # =========================

    order-service:
      build: ./order-service

      container_name: order-service

      ports:
        - "8084:8084"

      env_file:
        - ./order-service/.env

      depends_on:
        - postgres
        - eureka-server

      restart: unless-stopped






    # =========================
    # AGENT SERVICE
    # =========================

    agent-service:
      build: ./agent-service

      container_name: agent-service

      ports:
        - "8085:8085"

      depends_on:
        - postgres
        - eureka-server
        - ollama

      restart: unless-stopped





  # =========================
  # VOLUMES
  # =========================

  volumes:

    postgres_data:

    ollama_data:
